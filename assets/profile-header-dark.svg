  <title id="profile-quality-control-split-dark-desktop-title">Sample Builder | PROFILE LAB</title>
  <desc id="profile-quality-control-split-dark-desktop-desc">Creative Developer. Imagine it. Build it. Share it. The terminal types a command, completes demo checks, and repeats. Motion stops when reduced motion is preferred. Decorative demonstration; not live results.</desc>
