      .boot-label{animation:profile-quality-control-split-dark-desktop-boot 16s linear infinite}
      .trail{animation:profile-quality-control-split-dark-desktop-travel 16s linear infinite}
      .signal{animation:profile-quality-control-split-dark-desktop-breathe 4s ease-in-out infinite}
      .wait-1{animation:profile-quality-control-split-dark-desktop-wait-1 16s linear infinite}
      .run-1{animation:profile-quality-control-split-dark-desktop-run-1 16s linear infinite}
      .pass-1{animation:profile-quality-control-split-dark-desktop-pass-1 16s linear infinite}
      .rail-1{animation:profile-quality-control-split-dark-desktop-rail-1 16s ease-in-out infinite}
      .wait-2{animation:profile-quality-control-split-dark-desktop-wait-2 16s linear infinite}
      .run-2{animation:profile-quality-control-split-dark-desktop-run-2 16s linear infinite}
      .pass-2{animation:profile-quality-control-split-dark-desktop-pass-2 16s linear infinite}
      .rail-2{animation:profile-quality-control-split-dark-desktop-rail-2 16s ease-in-out infinite}
      .wait-3{animation:profile-quality-control-split-dark-desktop-wait-3 16s linear infinite}
      .run-3{animation:profile-quality-control-split-dark-desktop-run-3 16s linear infinite}
      .pass-3{animation:profile-quality-control-split-dark-desktop-pass-3 16s linear infinite}
      .rail-3{animation:profile-quality-control-split-dark-desktop-rail-3 16s ease-in-out infinite}
      .wait-4{animation:profile-quality-control-split-dark-desktop-wait-4 16s linear infinite}
      .run-4{animation:profile-quality-control-split-dark-desktop-run-4 16s linear infinite}
      .pass-4{animation:profile-quality-control-split-dark-desktop-pass-4 16s linear infinite}
      .rail-4{animation:profile-quality-control-split-dark-desktop-rail-4 16s ease-in-out infinite}
