<svg xmlns="http://www.w3.org/2000/svg" width="620" height="930" viewBox="0 0 620 930" fill="none" role="img" aria-labelledby="tfq-light-mobile-title tfq-light-mobile-desc">
  <title id="tfq-light-mobile-title">TFQ0 — Talal Alqahs | Quality Control</title>
  <desc id="tfq-light-mobile-desc">Software Test Engineer and Independent Developer. Build it. Break it. Make it better. A static, completed illustration of four demo checks. These are not live test results. This version contains no animation.</desc>
  <defs>
    <pattern id="tfq-light-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#586D63" opacity=".12"/></pattern>
    <clipPath id="tfq-light-mobile-command" clipPathUnits="userSpaceOnUse"><rect class="typed" width="226.8" height="30"/></clipPath>
  </defs>
  <style>
    .bg{fill:#F3F5EE} .panel{fill:#E8EEE5} .inner{fill:#FAFBF6}
    .line{stroke:#CED7CC;stroke-width:1} .ink{fill:#172A25}
    .muted{fill:#586D63} .accent{fill:#24734D} .soft{fill:#DCEBDA}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .pending,.running,.type-cursor,.trail,.boot-label{opacity:0}
    .pass,.complete,.ready-label{opacity:1}
    .typed{transform:scaleX(1);transform-origin:0 0}
    .ring{fill:none;stroke:#24734D;stroke-width:1.5;opacity:.4}
    </style>
  <rect x=".5" y=".5" width="619" height="929" rx="18" class="bg line"/>
  <rect x="1" y="64" width="618" height="802" fill="url(#tfq-light-mobile-grid)"/>
  <path d="M1 64H619" class="line"/>
  <!-- Static reduced-motion fallback. -->
  <!-- Monogram: an original geometric terminal mark. -->
  <rect x="30" y="19" width="27" height="27" rx="5" class="soft"/>
  <path d="M36 27l5 5-5 5m9 0h6" stroke="#24734D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<text x="70" y="38" class="mono ink" font-size="17" font-weight="700">TFQ0</text>
<text x="131" y="38" class="mono muted" font-size="13" >/ QUALITY CONTROL</text>
<circle cx="493" cy="33" r="4" class="accent signal"/>
<text x="507" y="38" class="mono muted" font-size="11" >PROFILE / 01</text>
<text x="30" y="113" class="mono accent" font-size="16" letter-spacing="2">TALAL ALQAHS</text>
<text x="28" y="181" class="sans ink" font-size="60" font-weight="700" letter-spacing="-2.7">Build it.</text>
<text x="28" y="244" class="sans ink" font-size="60" font-weight="700" letter-spacing="-2.7">Break it.</text>
<text x="28" y="307" class="sans accent" font-size="60" font-weight="700" letter-spacing="-2.7">Make it better.</text>
<text x="30" y="352" class="sans ink" font-size="21" >Software Test Engineer</text>
<text x="30" y="382" class="sans muted" font-size="18" >Independent Developer  /  Open Source</text>
<g transform="translate(30 415)">
<rect width="560" height="342" rx="12" class="inner line"/>
<path d="M0 43H560" class="line"/>
<circle cx="21" cy="22" r="4" fill="#5B7D6B" opacity="0.9"/>
<circle cx="36" cy="22" r="4" fill="#5B7D6B" opacity="0.68"/>
<circle cx="51" cy="22" r="4" fill="#5B7D6B" opacity="0.46"/>
<text x="79" y="27" class="mono muted" font-size="13" >tfq0@control:~</text>
<text x="539" y="27" class="mono muted" font-size="11" text-anchor="end" letter-spacing=".5">DEMO RUN</text>
<text x="21" y="84" class="mono accent" font-size="18" >$</text>
<g transform="translate(46 63)"><g clip-path="url(#tfq-light-mobile-command)"><text x="0" y="21" class="mono ink" font-size="18" >./quality-check --all</text></g><g class="type-cursor"><rect x="0" y="5" width="10.8" height="20" class="accent caret"/></g></g>
<text x="21" y="135" class="mono muted" font-size="12" >01</text>
<text x="58" y="135" class="mono ink" font-size="18" >API contracts</text>
