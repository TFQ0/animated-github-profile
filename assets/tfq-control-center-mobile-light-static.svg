<path d="M58 147H538" stroke="#D1DDD0" stroke-width="1"/>
<g transform="translate(58 147)"><rect width="480" height="1" class="accent rail-1" style="transform-origin:0 0"/></g>
<text x="21" y="176" class="mono muted" font-size="12" >02</text>
<text x="58" y="176" class="mono ink" font-size="18" >UI regression</text>
<text x="537" y="176" class="mono muted pending wait-2" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="176" class="mono accent running run-2" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-2"><path d="M472 170l4 4 8-9" stroke="#24734D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="176" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 188H538" stroke="#D1DDD0" stroke-width="1"/>
<g transform="translate(58 188)"><rect width="480" height="1" class="accent rail-2" style="transform-origin:0 0"/></g>
<text x="21" y="217" class="mono muted" font-size="12" >03</text>
<text x="58" y="217" class="mono ink" font-size="18" >Integration tests</text>
<text x="537" y="217" class="mono muted pending wait-3" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="217" class="mono accent running run-3" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-3"><path d="M472 211l4 4 8-9" stroke="#24734D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="217" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 229H538" stroke="#D1DDD0" stroke-width="1"/>
<g transform="translate(58 229)"><rect width="480" height="1" class="accent rail-3" style="transform-origin:0 0"/></g>
<text x="21" y="258" class="mono muted" font-size="12" >04</text>
<text x="58" y="258" class="mono ink" font-size="18" >Build pipeline</text>
<text x="537" y="258" class="mono muted pending wait-4" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="258" class="mono accent running run-4" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-4"><path d="M472 252l4 4 8-9" stroke="#24734D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="258" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 270H538" stroke="#D1DDD0" stroke-width="1"/>
<g transform="translate(58 270)"><rect width="480" height="1" class="accent rail-4" style="transform-origin:0 0"/></g>
<path d="M0 298H560" class="line"/>
<g class="complete"><text x="22" y="325" class="mono accent" font-size="17" >↳</text><text x="47" y="325" class="mono accent" font-size="13" >Checks complete. Keep improving.</text></g>
<g class="boot-label"><text x="22" y="325" class="mono muted" font-size="17" >↳</text><text x="47" y="325" class="mono muted" font-size="13" >Inspect. Verify. Improve.</text></g>
</g>
<path d="M30 775H590" class="line"/>
<path d="M58 811H562" stroke="#D1DDD0" stroke-width="1.5"/>
<path d="M58 811H562" stroke="#24734D" stroke-width="2" stroke-dasharray="60 940" pathLength="1000" class="trail"/>
<circle cx="58" cy="811" r="13" class="bg line"/>
<text x="58" y="815" class="mono accent" font-size="11" text-anchor="middle">1</text>
<text x="58" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">BUILD</text>
<circle cx="226" cy="811" r="13" class="bg line"/>
<text x="226" y="815" class="mono accent" font-size="11" text-anchor="middle">2</text>
<text x="226" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">TEST</text>
<circle cx="394" cy="811" r="13" class="bg line"/>
<text x="394" y="815" class="mono accent" font-size="11" text-anchor="middle">3</text>
<text x="394" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">LEARN</text>
<circle cx="562" cy="811" r="13" class="bg line"/>
<text x="562" y="815" class="mono accent" font-size="11" text-anchor="middle">4</text>
<text x="562" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">REPEAT</text>
<path d="M30 887H590" class="line"/>
<text x="30" y="912" class="mono muted" font-size="10" letter-spacing=".9">LESS NOISE. MORE SIGNAL.</text>
<text x="590" y="912" class="mono muted" font-size="9" text-anchor="end" letter-spacing=".3">NO MONOPOLY. YES TO OPEN SOURCE.</text>
