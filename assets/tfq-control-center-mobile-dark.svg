<svg xmlns="http://www.w3.org/2000/svg" width="620" height="930" viewBox="0 0 620 930" fill="none" role="img" aria-labelledby="tfq-dark-mobile-title tfq-dark-mobile-desc">
  <title id="tfq-dark-mobile-title">TFQ0 — Talal Alqahs | Quality Control</title>
  <desc id="tfq-dark-mobile-desc">Software Test Engineer and Independent Developer. Build it. Break it. Make it better. An illustrative terminal types a command, completes four demo checks and repeats. These are not live test results. Motion is disabled when reduced motion is preferred.</desc>
  <defs>
    <pattern id="tfq-dark-mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#97ACAF" opacity=".12"/></pattern>
    <clipPath id="tfq-dark-mobile-command" clipPathUnits="userSpaceOnUse"><rect class="typed" width="226.8" height="30"/></clipPath>
  </defs>
  <style>
    .bg{fill:#0C1418} .panel{fill:#111E24} .inner{fill:#0A1216}
    .line{stroke:#26383E;stroke-width:1} .ink{fill:#ECF1ED}
    .muted{fill:#97ACAF} .accent{fill:#ACF5C6} .soft{fill:#173B31}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .pending,.running,.type-cursor,.trail,.boot-label{opacity:0}
    .pass,.complete,.ready-label{opacity:1}
    .typed{transform:scaleX(1);transform-origin:0 0}
    .ring{fill:none;stroke:#ACF5C6;stroke-width:1.5;opacity:.4}
    @media (prefers-reduced-motion:no-preference){
      .typed{animation:type-in 16s steps(21,end) infinite}
      .type-cursor{animation:cursor-position 16s steps(21,end) infinite}
      .caret{animation:blink 1s steps(1,end) infinite}
      .complete{animation:complete-run 16s linear infinite}
      .ready-label{animation:ready 16s linear infinite}
      .boot-label{animation:boot 16s linear infinite}
      .trail{animation:travel 16s linear infinite}
      .signal{animation:breathe 4s ease-in-out infinite}
    
      .wait-1{animation:wait-1 16s linear infinite}
      .run-1{animation:run-1 16s linear infinite}
      .pass-1{animation:pass-1 16s linear infinite}
      .rail-1{animation:rail-1 16s ease-in-out infinite}
        
      .wait-2{animation:wait-2 16s linear infinite}
      .run-2{animation:run-2 16s linear infinite}
      .pass-2{animation:pass-2 16s linear infinite}
      .rail-2{animation:rail-2 16s ease-in-out infinite}
        
      .wait-3{animation:wait-3 16s linear infinite}
      .run-3{animation:run-3 16s linear infinite}
      .pass-3{animation:pass-3 16s linear infinite}
      .rail-3{animation:rail-3 16s ease-in-out infinite}
        
      .wait-4{animation:wait-4 16s linear infinite}
      .run-4{animation:run-4 16s linear infinite}
      .pass-4{animation:pass-4 16s linear infinite}
      .rail-4{animation:rail-4 16s ease-in-out infinite}
        }

    @keyframes type-in{0%,3%{transform:scaleX(0)}13%,96%{transform:scaleX(1)}99%,100%{transform:scaleX(0)}}
    @keyframes cursor-position{0%,3%{opacity:1;transform:translateX(0)}13%,14%{opacity:1;transform:translateX(226.8px)}15%,100%{opacity:0;transform:translateX(226.8px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes complete-run{0%,57%{opacity:0}59%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes ready{0%,57%{opacity:0}58%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes boot{0%,56%{opacity:1}58%,96%{opacity:0}99%,100%{opacity:1}}
    @keyframes travel{0%,4%{opacity:0;stroke-dashoffset:1000}6%{opacity:.8}94%{opacity:.8;stroke-dashoffset:0}96%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes wait-1{0%,13.5%{opacity:1}14%,96%{opacity:0}99%,100%{opacity:1}}
        @keyframes run-1{0%,13.5%{opacity:0}14%,23.5%{opacity:1}24%,100%{opacity:0}}
        @keyframes pass-1{0%,23.5%{opacity:0}24%,96%{opacity:1}99%,100%{opacity:0}}
        @keyframes rail-1{0%,14%{transform:scaleX(0);opacity:0}14.5%{opacity:1}24%,96%{transform:scaleX(1);opacity:1}99%,100%{transform:scaleX(0);opacity:0}}
        @keyframes wait-2{0%,23.5%{opacity:1}24%,96%{opacity:0}99%,100%{opacity:1}}
        @keyframes run-2{0%,23.5%{opacity:0}24%,33.5%{opacity:1}34%,100%{opacity:0}}
        @keyframes pass-2{0%,33.5%{opacity:0}34%,96%{opacity:1}99%,100%{opacity:0}}
        @keyframes rail-2{0%,24%{transform:scaleX(0);opacity:0}24.5%{opacity:1}34%,96%{transform:scaleX(1);opacity:1}99%,100%{transform:scaleX(0);opacity:0}}
        @keyframes wait-3{0%,33.5%{opacity:1}34%,96%{opacity:0}99%,100%{opacity:1}}
        @keyframes run-3{0%,33.5%{opacity:0}34%,43.5%{opacity:1}44%,100%{opacity:0}}
        @keyframes pass-3{0%,43.5%{opacity:0}44%,96%{opacity:1}99%,100%{opacity:0}}
        @keyframes rail-3{0%,34%{transform:scaleX(0);opacity:0}34.5%{opacity:1}44%,96%{transform:scaleX(1);opacity:1}99%,100%{transform:scaleX(0);opacity:0}}
        @keyframes wait-4{0%,43.5%{opacity:1}44%,96%{opacity:0}99%,100%{opacity:1}}
        @keyframes run-4{0%,43.5%{opacity:0}44%,53.5%{opacity:1}54%,100%{opacity:0}}
        @keyframes pass-4{0%,53.5%{opacity:0}54%,96%{opacity:1}99%,100%{opacity:0}}
        @keyframes rail-4{0%,44%{transform:scaleX(0);opacity:0}44.5%{opacity:1}54%,96%{transform:scaleX(1);opacity:1}99%,100%{transform:scaleX(0);opacity:0}}
        @media print{*{animation:none!important}.pending,.running,.type-cursor,.trail,.boot-label{opacity:0!important}.pass,.complete,.ready-label{opacity:1!important}}</style>
  <rect x=".5" y=".5" width="619" height="929" rx="18" class="bg line"/>
  <rect x="1" y="64" width="618" height="802" fill="url(#tfq-dark-mobile-grid)"/>
  <path d="M1 64H619" class="line"/>
  <!-- Monogram: an original geometric terminal mark. -->
  <rect x="30" y="19" width="27" height="27" rx="5" class="soft"/>
  <path d="M36 27l5 5-5 5m9 0h6" stroke="#ACF5C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<text x="70" y="38" class="mono ink" font-size="17" font-weight="700">TFQ0</text>
<text x="131" y="38" class="mono muted" font-size="13" >/ QUALITY CONTROL</text>
<circle cx="493" cy="33" r="4" class="accent signal"/>
<text x="507" y="38" class="mono muted" font-size="11" >PROFILE / 01</text>
<text x="30" y="113" class="mono accent" font-size="16" letter-spacing="2">TALAL ALQAHS</text>
<text x="28" y="181" class="sans ink" font-size="60" font-weight="700" letter-spacing="-2.7">Build it.</text>
<text x="28" y="244" class="sans ink" font-size="60" font-weight="700" letter-spacing="-2.7">Break it.</text>
<text x="28" y="307" class="sans accent" font-size="60" font-weight="700" letter-spacing="-2.7">Make it better.</text>
<text x="30" y="352" class="sans ink" font-size="21" >Software Test Engineer</text>
<text x="30" y="382" class="sans muted" font-size="18" >Independent Developer  /  Open Source</text>
<g transform="translate(30 415)">
<rect width="560" height="342" rx="12" class="inner line"/>
<path d="M0 43H560" class="line"/>
<circle cx="21" cy="22" r="4" fill="#779B9E" opacity="0.9"/>
<circle cx="36" cy="22" r="4" fill="#779B9E" opacity="0.68"/>
<circle cx="51" cy="22" r="4" fill="#779B9E" opacity="0.46"/>
<text x="79" y="27" class="mono muted" font-size="13" >tfq0@control:~</text>
<text x="539" y="27" class="mono muted" font-size="11" text-anchor="end" letter-spacing=".5">DEMO RUN</text>
<text x="21" y="84" class="mono accent" font-size="18" >$</text>
<g transform="translate(46 63)"><g clip-path="url(#tfq-dark-mobile-command)"><text x="0" y="21" class="mono ink" font-size="18" >./quality-check --all</text></g><g class="type-cursor"><rect x="0" y="5" width="10.8" height="20" class="accent caret"/></g></g>
<text x="21" y="135" class="mono muted" font-size="12" >01</text>
<text x="58" y="135" class="mono ink" font-size="18" >API contracts</text>
<text x="537" y="135" class="mono muted pending wait-1" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="135" class="mono accent running run-1" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-1"><path d="M472 129l4 4 8-9" stroke="#ACF5C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="135" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 147H538" stroke="#253B3F" stroke-width="1"/>
<g transform="translate(58 147)"><rect width="480" height="1" class="accent rail-1" style="transform-origin:0 0"/></g>
<text x="21" y="176" class="mono muted" font-size="12" >02</text>
<text x="58" y="176" class="mono ink" font-size="18" >UI regression</text>
<text x="537" y="176" class="mono muted pending wait-2" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="176" class="mono accent running run-2" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-2"><path d="M472 170l4 4 8-9" stroke="#ACF5C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="176" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 188H538" stroke="#253B3F" stroke-width="1"/>
<g transform="translate(58 188)"><rect width="480" height="1" class="accent rail-2" style="transform-origin:0 0"/></g>
<text x="21" y="217" class="mono muted" font-size="12" >03</text>
<text x="58" y="217" class="mono ink" font-size="18" >Integration tests</text>
<text x="537" y="217" class="mono muted pending wait-3" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="217" class="mono accent running run-3" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-3"><path d="M472 211l4 4 8-9" stroke="#ACF5C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="217" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 229H538" stroke="#253B3F" stroke-width="1"/>
<g transform="translate(58 229)"><rect width="480" height="1" class="accent rail-3" style="transform-origin:0 0"/></g>
<text x="21" y="258" class="mono muted" font-size="12" >04</text>
<text x="58" y="258" class="mono ink" font-size="18" >Build pipeline</text>
<text x="537" y="258" class="mono muted pending wait-4" font-size="12" text-anchor="end">QUEUED</text>
<text x="537" y="258" class="mono accent running run-4" font-size="12" text-anchor="end">RUNNING</text>
<g class="pass pass-4"><path d="M472 252l4 4 8-9" stroke="#ACF5C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="537" y="258" class="mono accent" font-size="13" text-anchor="end">PASS</text></g>
<path d="M58 270H538" stroke="#253B3F" stroke-width="1"/>
<g transform="translate(58 270)"><rect width="480" height="1" class="accent rail-4" style="transform-origin:0 0"/></g>
<path d="M0 298H560" class="line"/>
<g class="complete"><text x="22" y="325" class="mono accent" font-size="17" >↳</text><text x="47" y="325" class="mono accent" font-size="13" >Checks complete. Keep improving.</text></g>
<g class="boot-label"><text x="22" y="325" class="mono muted" font-size="17" >↳</text><text x="47" y="325" class="mono muted" font-size="13" >Inspect. Verify. Improve.</text></g>
</g>
<path d="M30 775H590" class="line"/>
<path d="M58 811H562" stroke="#253B3F" stroke-width="1.5"/>
<path d="M58 811H562" stroke="#ACF5C6" stroke-width="2" stroke-dasharray="60 940" pathLength="1000" class="trail"/>
<circle cx="58" cy="811" r="13" class="bg line"/>
<text x="58" y="815" class="mono accent" font-size="11" text-anchor="middle">1</text>
<text x="58" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">BUILD</text>
<circle cx="226" cy="811" r="13" class="bg line"/>
<text x="226" y="815" class="mono accent" font-size="11" text-anchor="middle">2</text>
<text x="226" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">TEST</text>
<circle cx="394" cy="811" r="13" class="bg line"/>
<text x="394" y="815" class="mono accent" font-size="11" text-anchor="middle">3</text>
<text x="394" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">LEARN</text>
<circle cx="562" cy="811" r="13" class="bg line"/>
<text x="562" y="815" class="mono accent" font-size="11" text-anchor="middle">4</text>
<text x="562" y="849" class="mono ink" font-size="14" text-anchor="middle" letter-spacing="1.2">REPEAT</text>
<path d="M30 887H590" class="line"/>
<text x="30" y="912" class="mono muted" font-size="10" letter-spacing=".9">LESS NOISE. MORE SIGNAL.</text>
<text x="590" y="912" class="mono muted" font-size="9" text-anchor="end" letter-spacing=".3">NO MONOPOLY. YES TO OPEN SOURCE.</text>
</svg>
